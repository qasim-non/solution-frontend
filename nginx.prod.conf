# Frontend production nginx config
# Serves React SPA and reverse-proxies /api & /sanctum to the Laravel backend.
# The backend target comes from the BACKEND_URL env var (default localhost:9000 for local dev).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend target: set via BACKEND_URL env, e.g. http://solution-app or https://x.up.railway.app
    resolver 8.8.8.8 1.1.1.1 valid=30s;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API calls to the Laravel backend
    location ~ ^/(api|sanctum) {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Prevent access to hidden files
    location ~ /\.ht {
        deny all;
    }
}
